name: Provider checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify generated native protocol
        shell: bash
        run: |
          set -euo pipefail
          tools_dir=$(mktemp -d)
          trap 'rm -rf "$tools_dir"' EXIT
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip -o "$tools_dir/protoc.zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $tools_dir/protoc.zip" | sha256sum -c -
          unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
          PATH="$tools_dir/protoc/bin:$PATH" sh scripts/generate-native-schema.sh
          git diff --exit-code -- internal/nativeprotocol
      - run: go mod tidy -diff
      - run: sh scripts/check-module-boundaries.sh
      - run: go test -race ./...
      - run: go vet -tags integration ./...
      - run: go test -race -tags integration ./integration -run 'TestRowTableCreationOfflineSubprocess|TestSchemaValidationOfflineSubprocess|TestNativeObjectConversionOfflineSubprocess|TestChildConversionOfflineSubprocess|TestTableConversionOfflineSubprocess|TestColumnConversionOfflineSubprocess|TestColumnStorageOfflineSubprocess|TestCoordinationSourceOfflineSubprocess|TestCoordinationComparisonOfflineSubprocess|TestYQLAnalysisOfflineSubprocess' -count=1
      - run: CGO_ENABLED=0 go build -o bin/ptah-plugin-ydb ./cmd/ptah-plugin-ydb
  windows-unit:
    runs-on: windows-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/metadata ./internal/history ./internal/backend
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ydbplatform/local-ydb:25.1.4.7
            features: enable_vector_index,enable_external_data_sources
          - image: ydbplatform/local-ydb:26.2.1.14
            features: enable_vector_index,enable_add_unique_index,enable_external_data_sources
    env:
      GOWORK: 'off'
      PTAH_YDB_TEST_URL: ydb://127.0.0.1:2136/local?go_balancer=disable
    services:
      ydb:
        image: ${{ matrix.image }}
        env:
          YDB_USE_IN_MEMORY_PDISKS: 'true'
          YDB_FEATURE_FLAGS: ${{ matrix.features }}
        ports:
          - 2136:2136
        options: >-
          --hostname localhost
          --health-cmd "sh /health_check"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check out the pinned host contract
        uses: actions/checkout@v7
        with:
          repository: stokaro/ptah
          ref: ef10c1c44a3067245920ca0ca07a7fcb97278b89
          path: .host-contract
      - name: Build the external host binary
        run: |
          host_binary="$RUNNER_TEMP/ptah-contract"
          CGO_ENABLED=0 go build -C .host-contract -o "$host_binary" ./cmd/ptah
          printf 'PTAH_HOST_TEST_BIN=%s\n' "$host_binary" >> "$GITHUB_ENV"
      - run: go test -race -tags integration ./integration -count=1 -v -timeout 45m
