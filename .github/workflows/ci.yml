name: Provider checks
on:
  push:
    branches: [master]
  pull_request:
  # The live master leg builds Ptah's master branch, so a nightly run shows a
  # host change that breaks this provider even when the provider is unchanged.
  schedule:
    - cron: "17 3 * * *"
  # A manual run can add a host ref leg: a branch, tag or commit of
  # stokaro/ptah, such as a host pull request's branch. A pull request names
  # one in .github/host-ref instead (see scripts/live-lines.sh).
  workflow_dispatch:
    inputs:
      host_ref:
        description: A branch, tag or commit of stokaro/ptah to run the live suite against, beside the release and master hosts
        required: false
        default: ''
permissions:
  contents: read
# A pull request's push supersedes its earlier run, so that run is canceled
# and the pull request does not wait behind its own old heads. A push to
# master, the nightly run and a manual run each get a group of their own, so
# none of them cancels another and every master commit keeps its result.
concurrency:
  group: provider-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify generated native protocol
        shell: bash
        run: |
          set -euo pipefail
          tools_dir=$(mktemp -d)
          trap 'rm -rf "$tools_dir"' EXIT
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip -o "$tools_dir/protoc.zip"
          echo "6930ebf62bd4ea607b98fff052596c6ee564b9835b4ce172c75a3f53ae9d91b7  $tools_dir/protoc.zip" | sha256sum -c -
          unzip -q "$tools_dir/protoc.zip" -d "$tools_dir/protoc"
          PATH="$tools_dir/protoc/bin:$PATH" sh scripts/generate-native-schema.sh
          git diff --exit-code -- internal/nativeprotocol
      - run: go mod tidy -diff
      - run: sh scripts/check-module-boundaries.sh
      # internal/tablecreate runs close to ten minutes under the race detector on
      # a hosted runner, so the default per-package timeout is too tight.
      - run: go test -race -timeout 30m ./...
      - run: go vet -tags integration ./...
      - run: go test -race -tags integration ./integration -run 'TestRowTableCreationOfflineSubprocess|TestSchemaValidationOfflineSubprocess|TestNativeObjectConversionOfflineSubprocess|TestChildConversionOfflineSubprocess|TestTableConversionOfflineSubprocess|TestColumnConversionOfflineSubprocess|TestColumnStorageOfflineSubprocess|TestCoordinationSourceOfflineSubprocess|TestCoordinationComparisonOfflineSubprocess|TestComparisonCountsOfflineSubprocess|TestYQLAnalysisOfflineSubprocess|TestMigrationLintOfflineSubprocess|TestRowServicesOfflineSubprocess|TestStatementFactsOfflineSubprocess|TestStatementFactsAnnotationOfflineSubprocess|TestEmbeddingStoreNeedsTheHostsFeatureSubprocess|TestSQLSchemaOfflineSubprocess|TestTextUnitsOfflineSubprocess|TestStatementStyleOfflineSubprocess|TestCommonObjectsOfflineSubprocess|TestSourceClaimsOfflineSubprocess|TestDeclarationsOfflineSubprocess|TestConformanceOfflineSubprocess' -count=1
      - run: CGO_ENABLED=0 go build -o bin/ptah-plugin-ydb ./cmd/ptah-plugin-ydb
  # The host's lint contract: qtlint, nolintguard and golangci-lint over both
  # build contours, and the declarative-test baseline. A file behind the
  # integration tag is outside the default build, so only the second run of
  # each linter reads the live tests. The golangci-lint version is the one
  # Ptah's own lint job pins; the other tools are pinned in go.mod.
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: qtlint
        run: make lint-qtlint
      - name: nolintguard
        run: make lint-nolintguard
      - name: Test style baseline
        run: make lint-teststyle
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m
          version: v2.15.0
      - name: Lint (integration contour)
        uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=30m --build-tags=integration
          version: v2.15.0
  # .golangci.yml keeps the host's lint contract: the linters and settings of
  # the host's .golangci.yml, which internal/cmd/lintcontract compares. The
  # release leg reads the newest Ptah release this provider runs on and
  # blocks. The master leg reads Ptah's master to show a change of the host's
  # contract early; it does not block, because the provider follows a host
  # change in a change of its own.
  lint-contract:
    name: lint contract (${{ matrix.host }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.host == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        host: [release, master]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Resolve the host
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ matrix.host }}
        run: scripts/resolve-host.sh "$HOST"
      - name: Check out the host's lint configuration
        if: steps.host.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: stokaro/ptah
          ref: ${{ steps.host.outputs.ref }}
          path: .host-contract
          sparse-checkout: .golangci.yml
          sparse-checkout-cone-mode: false
      - name: Compare with the host's lint contract
        if: steps.host.outputs.skip != 'true'
        run: go run ./internal/cmd/lintcontract -host .host-contract/.golangci.yml
  windows-unit:
    runs-on: windows-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./internal/metadata ./internal/history ./internal/backend
  # The lines the live job runs, each an image and a host, from
  # scripts/live-lines.sh: the release and master legs on every run, and a
  # host ref leg on each image when a manual run or .github/host-ref names one.
  lines:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.lines.outputs.lines }}
    steps:
      - uses: actions/checkout@v7
      - id: lines
        env:
          HOST_REF: ${{ inputs.host_ref }}
        run: scripts/live-lines.sh "$HOST_REF"
  # The provider is compatible with the provider contract, not with particular
  # Ptah versions. The release leg builds the newest published Ptah whose
  # contract this provider can run on and blocks the merge and the release. The
  # master leg builds Ptah's master to show a host change that breaks this
  # provider early; it does not block, because a red Ptah master is not this
  # repository's defect. A host ref leg builds the host a run names, and blocks.
  live:
    name: live (${{ matrix.line.image }}, ${{ matrix.line.host }}, shard ${{ matrix.shard }}/3)
    needs: lines
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.line.host == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(needs.lines.outputs.lines) }}
        # The suite outgrew one job's test timeout, so each line runs in
        # shards; scripts/live-shard.sh deals the tests out.
        shard: [1, 2, 3]
    env:
      GOWORK: 'off'
      # 8765 is the server's monitoring endpoint. The address names it, so a
      # session reads the database's feature flags there and inspection reads
      # the description of each column table, which the table service leaves
      # incomplete.
      PTAH_YDB_TEST_URL: ydb://127.0.0.1:2136/local?go_balancer=disable&monitoring=http://127.0.0.1:8765
      # A second server, for the tests whose dev database must be on a server
      # other than the target's. Both name their database /local.
      PTAH_YDB_OTHER_TEST_URL: ydb://127.0.0.1:2236/local?go_balancer=disable&monitoring=http://127.0.0.1:8766
      # A second database on the test server, of another name, for the tests
      # whose dev database reads authored references against another root.
      # scripts/second-database.sh serves it from a dynamic node of its own.
      PTAH_YDB_OTHER_DATABASE_TEST_URL: ydb://127.0.0.1:2137/local/db2?go_balancer=disable&monitoring=http://127.0.0.1:8767
    services:
      ydb:
        image: ${{ matrix.line.image }}
        # local-ydb leaves the replication API out of the gRPC services it
        # starts, and the provider describes an async replication and a
        # transfer through it; YDB_GRPC_SERVICES adds it to the others.
        env:
          YDB_USE_IN_MEMORY_PDISKS: 'true'
          YDB_FEATURE_FLAGS: ${{ matrix.line.features }}
          YDB_GRPC_SERVICES: replication
        ports:
          - 2136:2136
          - 8765:8765
          - 2137:2137
          - 8767:8767
        options: >-
          --hostname localhost
          --health-cmd "sh /health_check"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
      ydb-other:
        image: ${{ matrix.line.image }}
        env:
          YDB_USE_IN_MEMORY_PDISKS: 'true'
          YDB_FEATURE_FLAGS: ${{ matrix.line.features }}
          YDB_GRPC_SERVICES: replication
        ports:
          - 2236:2136
          - 8766:8765
        options: >-
          --hostname localhost
          --health-cmd "sh /health_check"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Serve a second database on the test server
        run: scripts/second-database.sh "${{ job.services.ydb.id }}"
      - name: Resolve the host
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST: ${{ matrix.line.host }}
        run: scripts/resolve-host.sh "$HOST"
      - name: Check out the host
        if: steps.host.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          repository: stokaro/ptah
          ref: ${{ steps.host.outputs.ref }}
          path: .host-contract
      - name: Name the host commit
        if: steps.host.outputs.skip != 'true'
        run: git -C .host-contract log -1 --format='host %H %s'
      # ptah-compat, the host's Atlas-compatible binary, is built from the same
      # checkout. The compatibility tests run it with PTAH_PROVIDER_CONFIG
      # naming this provider, and skip on a host that still builds in a YDB
      # engine of its own, which refuses the provider's registration.
      - name: Build the external host binary
        if: steps.host.outputs.skip != 'true'
        run: |
          host_binary="$RUNNER_TEMP/ptah-contract"
          compat_binary="$RUNNER_TEMP/ptah-compat-contract"
          CGO_ENABLED=0 go build -C .host-contract -o "$host_binary" ./cmd/ptah
          CGO_ENABLED=0 go build -C .host-contract -o "$compat_binary" ./cmd/ptah-compat
          printf 'PTAH_HOST_TEST_BIN=%s\n' "$host_binary" >> "$GITHUB_ENV"
          printf 'PTAH_HOST_COMPAT_TEST_BIN=%s\n' "$compat_binary" >> "$GITHUB_ENV"
      # The whole suite, the host-driven tests included, ran past its
      # 150-minute test timeout on a hosted runner, so a job runs one shard.
      - if: steps.host.outputs.skip != 'true'
        run: scripts/live-shard.sh ${{ matrix.shard }} 3 -race -count=1 -v -timeout 150m
