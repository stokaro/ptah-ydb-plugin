// Provider observations compose native descriptions without host schema types.
syntax = "proto3";
package ptah.ydb.native;
option go_package = "github.com/stokaro/ptah-ydb-plugin/internal/nativeprotocol";
import "draft/protos/ydb_view.proto";
import "protos/ydb_scheme.proto";
import "internal/nativeprotocol/indexes.proto";

// The view service owns query and access metadata; the table service owns
// attributes (including comments) on the same path.
message ViewObservation {
    Ydb.View.DescribeViewResult view = 1;
    DescribeTableResult properties = 2;
}

// Adapted from the pinned YDB table protocol cited in third_party/ydb/NOTICE.md.
// Use the provider's complete native column grammar in external tables too.
message DescribeExternalTableResult {
    Ydb.Scheme.Entry self = 1;
    optional string source_type = 2;
    optional string data_source_path = 3;
    optional string location = 4;
    repeated ColumnMeta columns = 5;
    map<string, string> content = 6;
}

// A resource pool's settings as .sys/resource_pools reports them, an unset
// setting (YDB's -1) left absent. Both representations of the resource pool
// model carry it: a pool has no access metadata the provider reads, and its
// name is the model's owner.
message ResourcePoolSettings {
    optional int32 concurrent_query_limit = 1;
    optional int32 queue_size = 2;
    optional double database_load_cpu_threshold = 3;
    optional double query_memory_limit_percent_per_node = 4;
    optional double query_cpu_limit_percent_per_node = 5;
    optional double total_cpu_limit_percent_per_node = 6;
    optional double resource_weight = 7;
}

// A resource pool classifier as .sys/resource_pool_classifiers reports it.
message ResourcePoolClassifierSettings {
    string resource_pool = 1;
    string member_name = 2;
    int64 rank = 3;
}

// A streaming query's persistent settings as .sys/streaming_queries reports
// them: the body inside DO BEGIN ... END DO, whether it runs, and its resource
// pool. Runtime status, retries, offsets and checkpoints are not settings.
message StreamingQuerySettings {
    string text = 1;
    optional bool run = 2;
    string resource_pool = 3;
}

// A declared streaming query: its settings, an unset run starting it and an
// empty pool selecting the pool default, and the declaration's permission to
// reset the query's aggregation state, which the database does not keep.
message StreamingQueryIntent {
    string text = 1;
    optional bool run = 2;
    string resource_pool = 3;
    bool allow_state_reset = 4;
}

// A scheme secret is observed only by identity. Its value is never read.
message SecretPresence {}

// A desired scheme secret holds a host-approved input reference only.
message SecretIntent { string value_env = 1; }

// How an async replication or a transfer reaches the database it reads: the
// connection string as YDB rebuilds it from its parts, and the credential by
// the secret that holds it, a name as written and a path relative to the
// database root. YDB never reads a password or a token back, so neither is
// carried. An empty field states nothing.
message ReplicationConnection {
    string connection_string = 1;
    string token_secret_name = 2;
    string token_secret_path = 3;
    string user = 4;
    string password_secret_name = 5;
    string password_secret_path = 6;
}

// One FOR <source> AS <target> pair of an async replication: a path of the
// source database, relative to its root or absolute, and the path of the
// replica in this database, relative to its root.
message ReplicationItem {
    string source = 1;
    string target = 2;
}

// An async replication as the replication service describes it: the
// connection, one item per replicated table, the consistency level and a
// commit interval other than YDB's default, and the state it reports
// (running, paused, done or error). Runtime statistics, item ids and the
// changefeeds YDB creates on the source are not settings.
message AsyncReplicationSettings {
    ReplicationConnection connection = 1;
    repeated ReplicationItem items = 2;
    string consistency_level = 3;
    string commit_interval = 4;
    string state = 5;
}

// A declared async replication: what CREATE ASYNC REPLICATION takes. An
// empty consistency level and commit interval leave YDB's defaults.
message AsyncReplicationIntent {
    ReplicationConnection connection = 1;
    repeated ReplicationItem items = 2;
    string consistency_level = 3;
    string commit_interval = 4;
}

// A transfer as the replication service describes it: its connection, its
// topic, its table, its lambda as written, its consumer, batch settings other
// than YDB's defaults, and the state it reports.
message TransferSettings {
    ReplicationConnection connection = 1;
    string source = 2;
    string target = 3;
    string lambda = 4;
    string consumer = 5;
    uint64 batch_size_bytes = 6;
    string flush_interval = 7;
    string state = 8;
}

// A declared transfer: what CREATE TRANSFER takes. An empty consumer lets
// YDB create one, and zero batch settings leave YDB's defaults.
message TransferIntent {
    ReplicationConnection connection = 1;
    string source = 2;
    string target = 3;
    string lambda = 4;
    string consumer = 5;
    uint64 batch_size_bytes = 6;
    string flush_interval = 7;
}
