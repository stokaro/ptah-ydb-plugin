version: 2

project_name: ptah-plugin-ydb

# Two documents are published beside the archives and listed in checksums.txt:
# the release lines the provider declares, and ptah-provider.json, which a host
# reads to choose the newest release whose minimum provider contract it meets.
before:
  hooks:
    - sh -c 'mkdir -p .release && go run ./cmd/release-lines > .release/release-lines.json'
    - sh -c 'go run ./cmd/provider-manifest -version {{ .Version }} > .release/ptah-provider.json'

builds:
  - id: ptah-plugin-ydb
    main: ./cmd/ptah-plugin-ydb
    binary: ptah-plugin-ydb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w

# A snapshot is named after its commit, not after whatever tag `git describe`
# finds, so a tag with a slash cannot put a path separator in an artifact name.
snapshot:
  version_template: "0.0.0-SNAPSHOT-{{ .ShortCommit }}"

# A host finds an archive by the name ptah-provider.json lists and checks it
# against the SHA-256 digest checksums.txt lists for it. The name has no variable
# part beyond version, OS and architecture:
# ptah-plugin-ydb_<version>_<os>_<arch>.tar.gz, or .zip on Windows. <version> is
# the tag without the leading "v".
archives:
  - id: ptah-plugin-ydb
    ids:
      - ptah-plugin-ydb
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

# One line per archive in `sha256sum` format: "<hex digest>  <file name>".
checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: ./.release/release-lines.json
    - glob: ./.release/ptah-provider.json

release:
  extra_files:
    - glob: ./.release/release-lines.json
    - glob: ./.release/ptah-provider.json
  # A re-run of a tag must finish: replace assets already on the release
  # instead of failing on the 422 "already_exists" answer.
  replace_existing_artifacts: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
